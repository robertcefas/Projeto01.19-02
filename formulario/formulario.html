<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fromulário | shock imports </title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

    </style>
</head>
<body>
    <div class="box">
        <form action="">
            <fieldset>
                <legend><b>Formulário dos Clientes</b></legend>
                <br>
                <div class="inputBox">
                    <input type="text" name="nome"id="nome" class="inputUser" required>
                    <label for="nome">Nome Completo</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="email" name="email"id="email" class="inputUser" required>
                    <label for="nome">Email</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="tel" name="telefone"id="telefone" class="inputUser" required>
                    <label for="nome">Telefone</label>
                </div>
                <br><br>
                <p>Sexo:</p>
                <input type="radio" name="genêro" value=" feminino" id="Feminino" required>
                <label for="Feminino">Feminino</label>
                <input type="radio" name="genêro" value=" Masculino" id="Masculino" required>
                <label for="Masculino">Masculino</label>
                <input type="radio" name="genêro" value=" Outro" id="Outro" required>
                <label for="Outro">Outro</label>
                <div class="inputBox">
                    <label for="data_nascimento"><b>Data de Nascimento</b></label>
                    <input type="date" name="data_nascimento"id="data_nascimento" class="inputUser" required>
                </div> 
                <br><br>
                 <div class="inputBox">
                    <input type="text" name="Cidade"id="Cidade" class="inputUser" required>
                    <label for="Cidade">Cidade</label>
                </div>
                <br><br>
                 <div class="inputBox">
                    <input type="text" name="Estado"id="Estado" class="inputUser" required>
                    <label for="Estado">Estado</label>
                </div>
                <br><br>
                 <div class="inputBox">
                    <input type="text" name="Endereço"id="Endereço" class="inputUser" required>
                    <label for="Endereço">Endereço</label>
                </div>
                <br><br>
                <input type="Submit" name="Submit" id="Submit">
            </fieldset>
        </form>
    </div>
</body>
</html>
