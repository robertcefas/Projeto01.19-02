<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <div class="barra-topo">
        <div class="logo-topo">
            <img src="assents/Design sem nome.png" alt="Logo_Marca" width="500" height="100">
        </div>
        <div class="menu-topo">
            <a href="http://127.0.0.1:5500/Projeto01.19-02/home/index.html">Home</a>
        </div>
    </div>
</header>

<main>

<div class="form-container">
    <h2>Cadastro</h2>
    <form>
        <input type="text" placeholder="Nome" required>
        <input type="email" placeholder="Email" required>
        <input type="email" placeholder="Confirme o Email" required>
        <input type="password" placeholder="Senha" required>
        <input type="password" placeholder="Confirme a Senha" required>
        <button type="submit">Cadastrar</button>
    </form>
</div>

<div class="form id">
    <form id="cadastroForm"
    <input type="text" id="nome" placeholder="Nome" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="email" id="confirmarEmail" placeholder="Confirme o Email" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <input type="password" id="confirmarSenha" placeholder="Confirme a Senha" required>
    <button type="submit">Cadastrar</button>
    </form>
</div>

</main>

<footer>
    © 2026 Shock Imports - Todos os direitos reservados
</footer>

</body>
</html>
